name: Cribbage QQND multiplayer B1

on:
  push:
    branches:
      - 'feat/server-multiplayer-and-card-fixes'

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Repair migration helper
        run: python scripts/fix_patch_script.py
      - name: Apply QQND multiplayer and UI fixes
        run: python scripts/apply_server_multiplayer_b1.py
      - name: Run existing UI regression
        run: node tests/ui-regression.mjs
      - name: Run server multiplayer regression
        run: node tests/server-multiplayer-regression.mjs
      - name: Commit generated changes
        run: |
          if git diff --quiet -- index.html scripts/apply_server_multiplayer_b1.py; then
            echo "generated files already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/apply_server_multiplayer_b1.py
          git commit -m "feat: migrate Cribbage multiplayer to QQND server B1 [skip ci]"
          git push
