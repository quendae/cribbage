name: Cribbage UI regression

on:
  push:
    branches:
      - 'ui/board-reference-dev-panel'

permissions:
  contents: write

jobs:
  ui-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reference-board UI redesign
        run: python scripts/apply_ui_v2.py
      - name: Run UI regression checks
        run: node tests/ui-regression.mjs
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: redesign cribbage board and add UI tuning panel [skip ci]"
          git push
