name: Cribbage UI regression

on:
  push:
    branches:
      - 'ui/board-reference-dev-panel'

permissions:
  contents: read

jobs:
  ui-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source regression checks
        run: node tests/ui-regression.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/cribbage-server.log 2>&1 &
          sleep 2
      - name: Run browser visual QA
        run: node scripts/visual_qa.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cribbage-visual-qa
          path: qa/
          if-no-files-found: warn
